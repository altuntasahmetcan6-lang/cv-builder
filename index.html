<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ücretsiz CV Oluşturucu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--desk:#E8EBF1;--ink:#18233F;--muted:#55607A;--line:#C5CDDB;--field:#FFFFFF;--mark:#FFD84D;--mark-shadow:rgba(24,35,63,.9);--danger:#B3261E;--focus:#2453FF;--hf:'Bricolage Grotesque','Source Sans 3',system-ui,sans-serif;--bf:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html{box-sizing:border-box;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--bf);font-size:16px;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.hero{text-align:center;padding:60px 0 40px;border-bottom:1.5px solid var(--line)}
.hero h1{font-family:var(--hf);font-size:42px;line-height:1.1;font-weight:700;margin:0 0 12px}
.hero .sub{font-size:18px;color:var(--muted);margin:0 0 32px}
.btn.primary{background:var(--mark);color:#18233F;padding:15px 32px;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--mark-shadow)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mark-shadow)}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px;padding:48px 0;margin-bottom:40px}
.feat{padding:24px;background:var(--field);border:1.5px solid var(--line);border-radius:16px;text-align:center}
.feat-icon{font-size:40px;margin:0 0 12px}
.feat h3{font-family:var(--hf);font-size:18px;font-weight:700;margin:0 0 8px}
.feat p{margin:0;color:var(--muted);font-size:14px}
#tool{display:none}
.top{padding:18px 0 10px}
.top h1{font-family:var(--hf);font-size:26px;font-weight:700;margin:0}
.meter{margin:6px 0 16px}
.meter-track{height:14px;background:var(--field);border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.meter-fill{height:100%;width:0;background:var(--mark);transition:width .3s}
.meter p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:16px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--mark);color:#18233F}
.grid{display:block}
.fld{margin:0 0 14px}
.fld label{display:block;margin:0 0 5px;font-size:14px;font-weight:600}
.fld input,.fld textarea{display:block;width:100%;min-height:48px;padding:12px 13px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:10px}
.sec{border-top:1.5px solid var(--line)}
.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:8px 2px;font-family:var(--hf);font-size:18px;font-weight:700}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec-body{padding:4px 2px 20px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:var(--desk);border-top:1.5px solid var(--line);z-index:30}
.bar .btn{width:100%;max-width:560px;margin:0 auto}
#app{padding-bottom:100px}
.stage{overflow-x:auto;padding:8px}
.paper-wrap{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(20,30,60,.28)}
.cv{width:794px;min-height:1123px;padding:52px 56px 36px;background:#fff;color:#1F2937;font-family:var(--bf);font-size:14px;line-height:1.5;transform-origin:0 0}
.cv .nm{font-size:32px;font-weight:700}
.cv .ti{margin-top:4px;font-size:16px}
.cv .sec-t{margin:22px 0 8px;font-size:15px;font-weight:700}
@media (min-width:920px){
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .tabs,.bar{display:none}
  .pane-prev{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <section id="hero" class="hero">
      <h1>📄 Ücretsiz CV Oluşturucu</h1>
      <p class="sub">Profesyonel CV'nizi 5 dakikada yapın.</p>
      <button type="button" class="btn primary" id="start-btn">CV'nizi Başlatın</button>
    </section>

    <section class="feats">
      <div class="feat"><div class="feat-icon">⚡</div><h3>Hızlı</h3><p>Anında güncellenir</p></div>
      <div class="feat"><div class="feat-icon">🎨</div><h3>Şablonlar</h3><p>3 profesyonel tasarım</p></div>
      <div class="feat"><div class="feat-icon">📱</div><h3>Her Cihazda</h3><p>Telefon, tablet, PC</p></div>
      <div class="feat"><div class="feat-icon">📥</div><h3>PDF İndir</h3><p>Hemen indirebilirsin</p></div>
      <div class="feat"><div class="feat-icon">🔐</div><h3>Güvenli</h3><p>Veriler tarayıcıda kalır</p></div>
      <div class="feat"><div class="feat-icon">💰</div><h3>Ücretsiz</h3><p>Gizli ücret yok</p></div>
    </section>

    <div id="tool" style="display:none">
      <header class="top">
        <h1>CV Oluşturucu</h1>
      </header>
      <div class="meter"><div class="meter-track"><div class="meter-fill"></div></div><p id="meter-p"></p></div>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-form" aria-selected="true" data-v="form">Bilgiler</button>
        <button type="button" id="tab-prev" aria-selected="false" data-v="prev">Önizleme</button>
      </div>
      <main class="grid">
        <section class="pane-form"><div id="form"></div></section>
        <section class="pane-prev"><div class="stage"><div class="paper-wrap"><div class="cv" id="cv"></div></div></div></section>
      </main>
    </div>
  </div>

  <div class="bar"><button type="button" class="btn primary" id="pdf-btn">PDF İndir</button></div>
</div>

<script>
(function(){
'use strict';
const KEY='cv-data';
const startBtn=document.getElementById('start-btn');
const hero=document.getElementById('hero');
const tool=document.getElementById('tool');
const feats=document.querySelectorAll('.feats')[0];
const formDiv=document.getElementById('form');
const cvDiv=document.getElementById('cv');
const pdfBtn=document.getElementById('pdf-btn');
const tabForm=document.getElementById('tab-form');
const tabPrev=document.getElementById('tab-prev');

let state={
  b:{name:'',title:'',email:'',phone:''},
  summary:'',
  exp:[{title:'',company:'',start:'',end:'',desc:''}],
  edu:[{school:'',degree:'',start:'',end:''}],
  skills:'',
  langs:''
};

function load(){
  try{
    const saved=localStorage.getItem(KEY);
    if(saved) state=JSON.parse(saved);
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
}

function buildForm(){
  let html='<details class="sec" open><summary>Kişisel Bilgiler</summary><div class="sec-body">';
  html+=`<div class="fld"><label>Ad Soyad</label><input type="text" value="${state.b.name}" data-p="b.name"></div>`;
  html+=`<div class="fld"><label>Unvan</label><input type="text" value="${state.b.title}" data-p="b.title"></div>`;
  html+=`<div class="fld"><label>E-posta</label><input type="email" value="${state.b.email}" data-p="b.email"></div>`;
  html+=`<div class="fld"><label>Telefon</label><input type="tel" value="${state.b.phone}" data-p="b.phone"></div>`;
  html+='</div></details>';

  html+='<details class="sec" open><summary>Özet</summary><div class="sec-body">';
  html+=`<div class="fld"><label>Kısa özet</label><textarea rows="3" data-p="summary">${state.summary}</textarea></div>`;
  html+='</div></details>';

  html+='<details class="sec"><summary>Deneyim</summary><div class="sec-body">';
  state.exp.forEach((e,i)=>{
    html+=`<div class="fld"><label>Pozisyon</label><input type="text" value="${e.title}" data-l="exp" data-i="${i}" data-f="title"></div>`;
    html+=`<div class="fld"><label>Şirket</label><input type="text" value="${e.company}" data-l="exp" data-i="${i}" data-f="company"></div>`;
  });
  html+='</div></details>';

  html+='<details class="sec"><summary>Eğitim</summary><div class="sec-body">';
  state.edu.forEach((e,i)=>{
    html+=`<div class="fld"><label>Okul</label><input type="text" value="${e.school}" data-l="edu" data-i="${i}" data-f="school"></div>`;
    html+=`<div class="fld"><label>Bölüm</label><input type="text" value="${e.degree}" data-l="edu" data-i="${i}" data-f="degree"></div>`;
  });
  html+='</div></details>';

  html+='<details class="sec"><summary>Beceriler</summary><div class="sec-body">';
  html+=`<div class="fld"><label>Beceriler (virgülle ayır)</label><textarea rows="3" data-p="skills">${state.skills}</textarea></div>`;
  html+=`<div class="fld"><label>Diller</label><textarea rows="2" data-p="langs">${state.langs}</textarea></div>`;
  html+='</div></details>';

  formDiv.innerHTML=html;
}

function renderCV(){
  const b=state.b;
  let html=`<div class="hd blk"><div class="nm">${b.name||'Ad Soyad'}</div>`;
  if(b.title) html+=`<div class="ti">${b.title}</div>`;
  if(b.email) html+=`<div style="font-size:13px;color:#666">${b.email}</div>`;
  html+='</div>';

  if(state.summary) html+=`<div class="sec-t">Özet</div><p>${state.summary}</p>`;

  if(state.exp.some(e=>e.title||e.company)){
    html+=`<div class="sec-t">Deneyim</div>`;
    state.exp.forEach(e=>{
      if(e.title||e.company) html+=`<div><strong>${e.title}</strong> - ${e.company}</div>`;
    });
  }

  if(state.edu.some(e=>e.school)){
    html+=`<div class="sec-t">Eğitim</div>`;
    state.edu.forEach(e=>{
      if(e.school) html+=`<div><strong>${e.school}</strong><br>${e.degree}</div>`;
    });
  }

  if(state.skills){
    html+=`<div class="sec-t">Beceriler</div><p>${state.skills}</p>`;
  }

  cvDiv.innerHTML=html;
  updateMeter();
}

function updateMeter(){
  const done=[state.b.name, state.b.title, state.summary, state.skills].filter(x=>x).length;
  const percent=Math.round(done/4*100);
  document.querySelector('.meter-fill').style.width=percent+'%';
  document.getElementById('meter-p').textContent=`${done}/4 tamamlandı`;
}

formDiv.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.p){
    const path=t.dataset.p.split('.');
    if(path.length===2) state[path[0]][path[1]]=t.value;
    else state[path[0]]=t.value;
  }else if(t.dataset.l){
    state[t.dataset.l][+t.dataset.i][t.dataset.f]=t.value;
  }
  save(); renderCV();
});

startBtn.addEventListener('click',()=>{
  hero.style.display='none';
  feats.style.display='none';
  tool.style.display='block';
  buildForm();
  renderCV();
});

tabForm.addEventListener('click',()=>{
  tabForm.setAttribute('aria-selected','true');
  tabPrev.setAttribute('aria-selected','false');
  document.querySelector('.pane-form').style.display='block';
  document.querySelector('.pane-prev').style.display='none';
});

tabPrev.addEventListener('click',()=>{
  tabPrev.setAttribute('aria-selected','true');
  tabForm.setAttribute('aria-selected','false');
  document.querySelector('.pane-form').style.display='none';
  document.querySelector('.pane-prev').style.display='block';
});

pdfBtn.addEventListener('click',async()=>{
  if(!window.html2canvas||!window.jspdf){
    alert('PDF aracı yüklenemedi. Tekrar dene.');
    return;
  }
  const canvas=await html2canvas(cvDiv,{scale:2,backgroundColor:'#fff'});
  const jsPDF=window.jspdf.jsPDF;
  const pdf=new jsPDF({format:'a4'});
  pdf.addImage(canvas.toDataURL('image/jpeg'),0,0,210,297);
  pdf.save('CV.pdf');
});

load();
buildForm();
renderCV();
})();
</script>
</body>
</html>
